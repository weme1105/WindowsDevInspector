name: Build

on:
  push:
    branches:
      - main
      - mvp
  pull_request:
    branches:
      - main
      - mvp

jobs:
  build-test:
    name: Build and test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore WindowsDevInspector.sln --configfile NuGet.Config

      - name: Build
        run: dotnet build WindowsDevInspector.sln --configuration Release --no-restore

      - name: Validate unsigned MSI contents
        shell: pwsh
        run: ./scripts/Test-InstallerPackage.ps1 -MsiPath ./installer/WindowsDevInspector.Installer/bin/x64/Release/WindowsDevInspector.msi

      - name: Test
        run: dotnet test WindowsDevInspector.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"
